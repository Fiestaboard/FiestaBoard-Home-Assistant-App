---
name: Upstream bump

# Polls the upstream FiestaBoard repo for new releases, opens a PR
# bumping the pinned base image plus the add-on version (mirroring
# upstream as `<upstream>-ha.N`), and queues it for auto-merge.
# We can't use Dependabot's docker watcher because the pin lives in
# fiestaboard/Dockerfile's `ARG BUILD_FROM` default (the FROM line is
# `FROM ${BUILD_FROM}`), which Dependabot doesn't parse.
#
# The `PR policy` ruleset on `main` requires six status checks
# (yamllint, hadolint, shellcheck, HA config validation, Bats unit
# tests, Image smoke test (amd64)), all of which run on `pull_request`.
# A plain `gh pr merge` seconds after opening the PR is therefore
# rejected with "the base branch policy prohibits the merge" — the
# checks are still pending. The merge step uses `--auto` so GitHub
# lands the squash once the checks pass, which also means a bump whose
# checks fail stays an open red PR instead of turning `main` red.
#
# Auth: PR creation and the merge use a GitHub App installation token
# minted per run (`BUMP_APP_ID` + `BUMP_APP_PRIVATE_KEY`) rather than the
# default `GITHUB_TOKEN`. GitHub Actions deliberately suppresses workflow
# runs for events whose push was made by `GITHUB_TOKEN`; an App
# installation token is not subject to that suppression, so the merge
# push fires the `Builder` workflow and publishes the new image.
#
# This replaced a fine-grained PAT (`BUMP_PAT`), which expired on
# 2026-08-17 and hard-failed every hourly run with `Bad credentials`
# until it was noticed. Installation tokens are minted fresh each run
# and expire in an hour, so there is no long-lived credential to lapse —
# only the App's private key, which does not expire.
on:
  schedule:
    # Hourly. Idempotent: only acts when upstream actually changed.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Force a specific upstream version (e.g. 6.14.0). Leave empty to use latest."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Mint bump token
        # Installation token for the bump App. Scoped to this repo with
        # Contents + Pull requests: write. A bad/rotated private key fails
        # here, before any repo state is touched.
        id: bump_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}

      - name: Determine current and latest versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          current_upstream="$(grep -E '^ARG BUILD_FROM=fiestaboard/fiestaboard:' fiestaboard/Dockerfile \
            | sed -E 's/.*fiestaboard:([^ ]+).*/\1/')"
          if [ -n "${FORCE_VERSION}" ]; then
            latest_upstream="${FORCE_VERSION}"
          else
            latest_upstream="$(gh api repos/Fiestaboard/FiestaBoard/releases/latest --jq '.tag_name' \
              | sed 's/^v//')"
          fi
          # New upstream → reset the -ha.N revision to 1. Manual add-on-only
          # fixes bump the -ha.N counter outside this workflow.
          new_addon_version="${latest_upstream}-ha.1"
          {
            echo "current_upstream=${current_upstream}"
            echo "latest_upstream=${latest_upstream}"
            echo "new_addon_version=${new_addon_version}"
          } >> "$GITHUB_OUTPUT"
          if [ "${current_upstream}" = "${latest_upstream}" ]; then
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_bump=true"  >> "$GITHUB_OUTPUT"
          fi

      - name: Verify bump credentials
        # Unconditional (no needs_bump gate) so a token that mints but
        # can't reach the repo — App uninstalled, repo access narrowed —
        # turns the run red the same hour, not up to ~6 days later on the
        # next actual bump. Runs before the gated steps so a credential
        # failure points at auth rather than whichever gated step ran first.
        env:
          GH_TOKEN: ${{ steps.bump_token.outputs.token }}
        run: gh api repos/${{ github.repository }} --jq .full_name > /dev/null

      - name: Close stale bump PRs
        # Older bump PRs rot once main moves — `config.yaml` and CHANGELOG.md
        # conflict, auto-merge stalls. Close them before opening the new one
        # so only the current target branch is live.
        if: steps.versions.outputs.needs_bump == 'true'
        env:
          GH_TOKEN: ${{ steps.bump_token.outputs.token }}
          KEEP_BRANCH: upstream/fiestaboard-${{ steps.versions.outputs.latest_upstream }}
        run: |
          set -euo pipefail
          gh pr list \
            --label upstream \
            --state open \
            --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"upstream/fiestaboard-\")) | select(.headRefName != \"${KEEP_BRANCH}\") | .number" \
          | while read -r pr; do
              [ -z "${pr}" ] && continue
              echo "Closing stale bump PR #${pr}"
              gh pr close "${pr}" --delete-branch \
                --comment "Superseded by bump to ${{ steps.versions.outputs.latest_upstream }}."
            done

      - name: Bump pinned files
        if: steps.versions.outputs.needs_bump == 'true'
        env:
          CURRENT: ${{ steps.versions.outputs.current_upstream }}
          LATEST: ${{ steps.versions.outputs.latest_upstream }}
          NEW_ADDON_VERSION: ${{ steps.versions.outputs.new_addon_version }}
        run: |
          set -euo pipefail
          sed -i "s|fiestaboard/fiestaboard:${CURRENT}|fiestaboard/fiestaboard:${LATEST}|g" \
            fiestaboard/Dockerfile
          sed -i -E "s|^version:.*|version: \"${NEW_ADDON_VERSION}\"|" fiestaboard/config.yaml
          today="$(date -u +%Y-%m-%d)"
          tmp="$(mktemp)"
          {
            head -n 5 fiestaboard/CHANGELOG.md
            printf '\n## %s — %s\n\n### Changed\n\n- Bump upstream FiestaBoard **%s → %s**.\n' \
              "${NEW_ADDON_VERSION}" "${today}" "${CURRENT}" "${LATEST}"
            tail -n +6 fiestaboard/CHANGELOG.md
          } > "${tmp}"
          mv "${tmp}" fiestaboard/CHANGELOG.md

      - name: Open PR
        if: steps.versions.outputs.needs_bump == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          # App token (not GITHUB_TOKEN) so the branch push that lands the
          # merge commit triggers `Builder`. See header comment.
          token: ${{ steps.bump_token.outputs.token }}
          branch: upstream/fiestaboard-${{ steps.versions.outputs.latest_upstream }}
          base: main
          title: "feat: bump upstream FiestaBoard to ${{ steps.versions.outputs.latest_upstream }}"
          commit-message: |
            feat: bump upstream FiestaBoard ${{ steps.versions.outputs.current_upstream }} → ${{ steps.versions.outputs.latest_upstream }}
          body: |
            Automated hourly bump from the **Upstream bump** workflow.

            Updates `fiestaboard/Dockerfile`'s `BUILD_FROM` default (the single
            upstream pin), `fiestaboard/config.yaml`'s `version:`, and prepends
            a `CHANGELOG.md` entry.

            Auto-merge is enabled on this PR by the same workflow job; it
            squash-merges once the required checks pass, after which
            `Builder` publishes
            `fiestaboard/fiestaboard-ha-app:${{ steps.versions.outputs.new_addon_version }}`.

            Upstream release notes:
            https://github.com/Fiestaboard/FiestaBoard/releases/tag/v${{ steps.versions.outputs.latest_upstream }}

            **Skim before merge** — revert or amend if a new `FIESTABOARD_*` env var
            or renamed option needs to be wired into `config.yaml`,
            `rootfs/usr/local/bin/ha-run.sh`, and `tests/ha-run.bats`.
          labels: |
            dependencies
            upstream

      - name: Enable auto-merge
        if: |
          steps.versions.outputs.needs_bump == 'true' &&
          steps.pr.outputs.pull-request-number
        env:
          # App token (not GITHUB_TOKEN) so the merge push fires `Builder`.
          # GitHub performs an auto-merge on behalf of the actor that
          # enabled it, so the push is attributed to the App. See header
          # comment.
          GH_TOKEN: ${{ steps.bump_token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          # `--auto`, not `--admin`: the required checks exist to catch
          # bumps that need `config.yaml`/`ha-run.sh` wiring, so bypassing
          # them would defeat the ruleset rather than satisfy it.
          gh pr merge --squash --delete-branch --auto "${PR_NUMBER}"
